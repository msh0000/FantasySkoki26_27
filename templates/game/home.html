{% extends "base.html" %}
{% block content %}
<article>
  <h2>Ranking sezonu</h2>
  {% if rows %}
  <table>
    <thead><tr><th>#</th><th>Gracz</th><th>Punkty</th></tr></thead>
    <tbody>
      {% for player, points in rows %}
      <tr><td>{{ forloop.counter }}</td><td>{{ player.name }}</td><td>{{ points|floatformat:"-1" }}</td></tr>
      {% endfor %}
    </tbody>
  </table>
  {% else %}
  <p>Brak graczy. Dodaj ich w panelu admina.</p>
  {% endif %}
</article>
{% endblock %}
